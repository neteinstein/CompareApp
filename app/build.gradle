plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-kapt'
}

android {
    namespace 'org.neteinstein.compareapp'
    compileSdk = 36

    defaultConfig {
        applicationId "org.neteinstein.compareapp"
        minSdk 24
        targetSdk 36
        // Use BUILD_NUMBER from environment (GitHub Actions run number) or default to 1
        def buildNumber = System.getenv("BUILD_NUMBER")
        versionCode buildNumber ? buildNumber.toInteger() : 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // Signing configuration using environment variables or GitHub secrets.
            // KEYSTORE_FILE is always the base64-encoded contents of the keystore, not a path.
            if (System.getenv("KEYSTORE_FILE")) {
                def keystoreBytes = System.getenv("KEYSTORE_FILE").decodeBase64()
                def keystorePath = file("${buildDir}/release.keystore")
                keystorePath.parentFile.mkdirs()
                keystorePath.bytes = keystoreBytes
                storeFile keystorePath
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // Distinct applicationId so a debug build installs side by side with the release
            // app instead of overwriting it (Android treats differing applicationId as a
            // different app entirely).
            applicationIdSuffix ".test"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign with the real release key when CI provides one; otherwise fall back to debug
            // signing so `./gradlew assembleRelease` still works on a developer machine without
            // the release signing secrets configured.
            signingConfig System.getenv("KEYSTORE_FILE") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }
}

dependencies {
    // Core Android dependencies
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'

    // Google Play Services
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Compose BOM for version alignment
    implementation platform('androidx.compose:compose-bom:2025.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.12.2'

    // Hilt for dependency injection
    implementation 'com.google.dagger:hilt-android:2.51.1'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    kapt 'com.google.dagger:hilt-android-compiler:2.51.1'
    
    // Debug dependencies
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    
    // Unit testing dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'org.mockito:mockito-core:5.21.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.1.0'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    
    // Screenshot testing with Roborazzi - DISABLED due to JitPack access issues
    // TODO: Re-enable when JitPack dependency resolution is fixed
    // androidTestImplementation 'com.github.takahirom.roborazzi:roborazzi:1.7.0'
    // androidTestImplementation 'com.github.takahirom.roborazzi:roborazzi-compose:1.7.0'
    // androidTestImplementation 'com.github.takahirom.roborazzi:roborazzi-rule:1.7.0'
    
    // Android instrumented testing dependencies
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.12.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
