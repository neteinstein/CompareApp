name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify release signing secrets are configured
        run: |
          # app/build.gradle silently falls back to debug signing when KEYSTORE_FILE isn't set,
          # which lets `./gradlew assembleRelease` still work on a dev machine. But on this
          # ephemeral GitHub Actions runner that fallback creates a brand-new, random debug
          # keystore on every single run (there's no persisted ~/.android/debug.keystore to
          # reuse) - so each GitHub Release APK ends up signed with a *different* certificate.
          # Android refuses to install an update whose signing certificate doesn't match the
          # currently-installed app's, so the in-app "Update to latest" flow
          # (UpdateRepositoryImpl/AppUpdateInstaller) always downloads fine and then always fails
          # to install. Fail loudly here instead of silently publishing another broken update.
          if [ -z "${{ secrets.KEYSTORE_FILE }}" ]; then
            echo "::error::KEYSTORE_FILE (and KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD) repository secrets are not set. Without them, this workflow falls back to a fresh debug keystore on every run, so each release gets a different signing certificate and in-app updates fail to install. Add the real signing secrets under Settings > Secrets and variables > Actions before releasing."
            exit 1
          fi

      - name: Build and Sign APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep "versionName" app/build.gradle | \
            awk '{print $2}' | tr -d '"')
          BUILD_NUMBER=${{ github.run_number }}
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          # Create version string in MAJOR.MINOR.PATCH.BUILD format
          VERSION_WITH_BUILD="${VERSION_NAME}.${BUILD_NUMBER}"
          echo "version_with_build=${VERSION_WITH_BUILD}" >> $GITHUB_OUTPUT
          TAG="v${VERSION_WITH_BUILD}"
          echo "release_tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          # Check if signed APK exists, otherwise use unsigned
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            SRC="app/build/outputs/apk/release/app-release.apk"
            SUFFIX="signed"
          else
            SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
            SUFFIX="unsigned"
          fi
          VERSION="${{ steps.version.outputs.version_with_build }}"
          DEST="app/build/outputs/apk/release/CompareApp-${VERSION}-${SUFFIX}.apk"
          mv "${SRC}" "${DEST}"
          echo "apk_suffix=${SUFFIX}" >> $GITHUB_OUTPUT
        id: rename

      - name: Get certificate fingerprint
        id: cert
        run: |
          APK="app/build/outputs/apk/release/CompareApp-${{ steps.version.outputs.version_with_build }}-${{ steps.rename.outputs.apk_suffix }}.apk"
          # app/build.gradle sets minSdk 24, so AGP disables APK Signature Scheme v1
          # (JAR signing) by default and signs release APKs with v2/v3 only. keytool
          # only understands v1 signatures, so `keytool -printcert -jarfile` silently
          # reports "Not a signed jar file" on this APK. apksigner understands every
          # APK signing scheme, so use it instead.
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)/apksigner
          FINGERPRINT=$("${APKSIGNER}" verify --print-certs "${APK}" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)
          if [ -z "${FINGERPRINT}" ]; then
            echo "::error::Failed to extract the SHA-256 certificate fingerprint from ${APK}."
            exit 1
          fi
          echo "sha256_fingerprint=${FINGERPRINT}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: >
            Release ${{ steps.version.outputs.version_with_build }}
          body: |
            ## CompareApp Release ${{ steps.version.outputs.version_with_build }}

            Version: ${{ steps.version.outputs.version_name }}
            Build number: ${{ steps.version.outputs.build_number }}
            Built from commit: ${{ github.sha }}

            ### Installation
            Download the APK file below and install it on your Android device.

            ### Verify the APK signature
            Signing certificate SHA-256 fingerprint:
            ```
            ${{ steps.cert.outputs.sha256_fingerprint }}
            ```
            Compare this against the output of `apksigner verify --print-certs CompareApp-*.apk`
            before installing, to confirm the APK was signed with the same certificate as the
            currently installed app.

            ### Requirements
            - Android 7.0 (API 24) or higher
            - Uber app (for Uber comparison)
            - Bolt app (for Bolt comparison)
          files: |
            app/build/outputs/apk/release/CompareApp-${{ steps.version.outputs.version_with_build }}-${{ steps.rename.outputs.apk_suffix }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          append_body: true
